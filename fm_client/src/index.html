<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivlab FM</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon"
        href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zY2hlbWFzL3N2ZyIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiB2aWV3Qm94PSIwIDAgMTYgMTYiPjxjaXJjbGUgY3g9IjgiIGN5PSI4IiByPSI3IiBmaWxsPSJibGFjayIgLz48L3N2Zz4="
        type="image/x-icon">
</head>

<body>
    <div class="player">
        <div class="header">
            <h1>🎵 Pivlab FM</h1>
            <button class="scan-btn" id="scanBtn">↻</button>
        </div>

        <div class="track-info" id="trackInfo">
            <div class="no-track">OFF</div>
        </div>

        <div class="controls">
            <button class="control-btn" id="playBtn">▶</button>
            <button class="control-btn" id="nextBtn" disabled>⏭</button>
        </div>

        <div class="volume-container">
            <span class="volume-icon" id="volumeIcon">🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            <span class="volume-percent" id="volumePercent">70%</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="footer" id="footer">
            <span id="trackCount">0</span> tracks
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
