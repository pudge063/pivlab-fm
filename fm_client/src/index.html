<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12151a">
    <title>Pivlab FM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #101318;
            --panel: rgba(30, 35, 44, 0.72);
            --panel-solid: #1a1e26;
            --amber: #f0a94e;
            --amber-soft: rgba(240, 169, 78, 0.85);
            --amber-dim: #5c471f;
            --red: #ea5a4f;
            --teal: #63a8a2;
            --text: #f5f1e8;
            --muted: #929aa8;
            --hair: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.001s !important;
                transition-duration: 0.001s !important;
            }
        }

        html {
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            position: fixed;
            inset: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        /* ambient background glow, purely decorative */
        .glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow span {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.35;
        }

        .glow span:nth-child(1) {
            width: 340px;
            height: 340px;
            background: var(--amber);
            top: -120px;
            left: -100px;
            animation: float1 16s ease-in-out infinite;
        }

        .glow span:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--teal);
            bottom: -110px;
            right: -90px;
            animation: float2 20s ease-in-out infinite;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 40px);
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25px, -30px);
            }
        }

        .set {
            position: relative;
            z-index: 1;
            width: min(94vw, 480px);
            max-height: calc(100dvh - 24px);
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            overscroll-behavior: contain;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 40%), var(--panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--hair);
            border-radius: 26px;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: clamp(16px, 4vw, 26px);
            scrollbar-width: none;
        }

        .set::-webkit-scrollbar {
            display: none;
        }

        /* ---- header ---- */
        .strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: clamp(12px, 3vw, 18px);
            border-bottom: 1px solid var(--hair);
        }

        .wordmark {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .wordmark .name {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            font-size: 19px;
        }

        .wordmark .band {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--teal);
            letter-spacing: 0.08em;
        }

        .onair {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            color: var(--muted);
        }

        .onair .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3f47;
            transition: background .3s, box-shadow .3s;
        }

        .onair.live .dot {
            background: var(--amber);
            box-shadow: 0 0 10px 3px rgba(240, 169, 78, 0.6);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ---- now playing: disc + info ---- */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding-bottom: clamp(14px, 3vw, 20px);
        }

        @media (min-width: 460px) {
            .stage {
                flex-direction: row;
                text-align: left;
                align-items: center;
            }
        }

        .cover-wrap {
            flex-shrink: 0;
        }

        .disc {
            width: clamp(96px, 26vw, 128px);
            height: clamp(96px, 26vw, 128px);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            animation: spin 18s linear infinite;
            animation-play-state: paused;
        }

        body.playing .disc {
            animation-play-state: running;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .disc-grooves {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-image: repeating-radial-gradient(circle at center,
                    rgba(0, 0, 0, 0.28) 0px, rgba(0, 0, 0, 0.28) 1px,
                    transparent 1px, transparent 6px);
            opacity: 0.55;
        }

        .disc-sheen {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.35), transparent 45%);
        }

        .disc-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36%;
            height: 36%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--panel-solid);
            border: 1px solid var(--hair);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: clamp(14px, 4vw, 18px);
            color: var(--text);
        }

        .disc-label::after {
            content: '';
            position: absolute;
            width: 18%;
            height: 18%;
            border-radius: 50%;
            background: var(--bg);
        }

        .info {
            min-width: 0;
            flex: 1;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.16em;
            color: var(--muted);
            margin: 0 0 6px;
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: clamp(19px, 5vw, 26px);
            line-height: 1.18;
            letter-spacing: 0.01em;
            margin: 0 0 4px;
            overflow-wrap: break-word;
        }

        .artist {
            font-size: clamp(13px, 3vw, 14.5px);
            color: var(--teal);
            font-weight: 500;
            margin: 0;
        }

        .vu {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 16px;
            margin-top: 10px;
        }

        @media (min-width: 460px) {
            .vu {
                justify-content: flex-start;
            }
        }

        .vu span {
            width: 3px;
            background: var(--amber-dim);
            border-radius: 2px;
            height: 4px;
            transition: background .3s;
        }

        body.playing .vu span {
            background: var(--amber);
            animation: bar 1.1s ease-in-out infinite;
        }

        .vu span:nth-child(1) {
            animation-delay: -0.9s;
        }

        .vu span:nth-child(2) {
            animation-delay: -0.5s;
        }

        .vu span:nth-child(3) {
            animation-delay: -1.1s;
        }

        .vu span:nth-child(4) {
            animation-delay: -0.2s;
        }

        .vu span:nth-child(5) {
            animation-delay: -0.7s;
        }

        @keyframes bar {

            0%,
            100% {
                height: 4px;
            }

            50% {
                height: 16px;
            }
        }

        /* ---- tuner dial (seek) ---- */
        .dial-wrap {
            padding: 4px 2px 0;
        }

        .dial-times {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .dial-times .elapsed {
            color: var(--amber);
        }

        .dial-track {
            position: relative;
            height: 32px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--hair);
            overflow: hidden;
        }

        .dial-ticks {
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0px, rgba(255, 255, 255, 0.06) 1px, transparent 1px, transparent 8px);
        }

        .dial-ticks::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.14) 0px, rgba(255, 255, 255, 0.14) 1.5px, transparent 1.5px, transparent 40px);
        }

        .dial-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, rgba(240, 169, 78, 0.10), rgba(240, 169, 78, 0.26));
            border-right: 1px solid rgba(240, 169, 78, 0.55);
            transition: width .12s linear;
        }

        .dial-needle {
            position: absolute;
            top: 2px;
            bottom: 2px;
            width: 2px;
            left: 0%;
            background: var(--amber);
            box-shadow: 0 0 10px 2px rgba(240, 169, 78, 0.85);
            transform: translateX(-1px);
            transition: left .12s linear;
            pointer-events: none;
        }

        .dial-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            touch-action: pan-y;
        }

        .dial-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 1px;
            height: 1px;
        }

        /* ---- transport ---- */
        .transport {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 5vw, 26px);
            margin-top: clamp(16px, 4vw, 22px);
        }

        .btn {
            font-family: inherit;
            border: none;
            cursor: pointer;
            background: none;
            color: var(--text);
        }

        .btn-play {
            width: clamp(56px, 15vw, 64px);
            height: clamp(56px, 15vw, 64px);
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--hair);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform .12s, box-shadow .2s;
        }

        .btn-play:active {
            transform: scale(0.94);
        }

        .btn-play svg {
            fill: var(--amber);
        }

        body.playing .btn-play {
            box-shadow: 0 0 0 4px rgba(240, 169, 78, 0.16), 0 10px 22px -8px rgba(0, 0, 0, 0.6);
        }

        .btn-next {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            transition: color .15s, transform .12s, background .15s;
        }

        .btn-next:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-next:active {
            transform: scale(0.92);
        }

        .btn-next svg {
            fill: currentColor;
        }

        .btn-next:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* ---- volume ---- */
        .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: clamp(16px, 4vw, 20px);
        }

        .icon-btn {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--muted);
            border-radius: 50%;
            transition: color .15s, background .15s;
        }

        .icon-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-btn svg {
            fill: currentColor;
        }

        .volume-input {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--amber) 100%, rgba(255, 255, 255, 0.1) 100%);
            outline: none;
            cursor: pointer;
        }

        .volume-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px rgba(240, 169, 78, 0.7);
            border: none;
            margin-top: 0;
        }

        .volume-input::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px rgba(240, 169, 78, 0.7);
            border: none;
        }

        .volume-input::-moz-range-track {
            height: 4px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ---- footer ---- */
        .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: clamp(16px, 4vw, 22px);
            padding-top: 14px;
            border-top: 1px solid var(--hair);
        }

        .lib-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--muted);
        }

        .scan-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.06em;
            color: var(--muted);
            border: 1px solid var(--hair);
            border-radius: 20px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.02);
            transition: color .15s, border-color .15s;
            white-space: nowrap;
        }

        .scan-btn:hover:not(:disabled) {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .scan-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .scan-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
        }

        .scan-btn.busy .dot {
            background: var(--red);
            animation: pulse 0.8s ease-in-out infinite;
        }

        .status-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--muted);
            text-align: center;
            margin-top: 10px;
            min-height: 14px;
        }

        .status-line.err {
            color: var(--red);
        }
    </style>
</head>

<body>

    <div class="glow"><span></span><span></span></div>

    <div class="set">
        <div class="strip">
            <div class="wordmark">
                <span class="name">PIVLAB</span>
                <span class="band">FM · 88.1</span>
            </div>
            <div class="onair" id="onair">
                <span class="dot"></span>
                <span id="onairLabel">OFF AIR</span>
            </div>
        </div>

        <div class="stage">
            <div class="cover-wrap">
                <div class="disc" id="disc">
                    <div class="disc-grooves"></div>
                    <div class="disc-sheen"></div>
                    <div class="disc-label"><span id="discInitial">—</span></div>
                </div>
            </div>
            <div class="info">
                <p class="eyebrow" id="eyebrow">STAND BY</p>
                <h1 class="title" id="title">—</h1>
                <p class="artist" id="artist">Press play to tune in</p>
                <div class="vu">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="dial-wrap">
            <div class="dial-times">
                <span class="elapsed" id="timeElapsed">0:00</span>
                <span id="timeTotal">0:00</span>
            </div>
            <div class="dial-track" id="dialTrack">
                <div class="dial-ticks"></div>
                <div class="dial-fill" id="dialFill"></div>
                <div class="dial-needle" id="dialNeedle"></div>
                <input type="range" class="dial-input" id="seek" min="0" max="1000" value="0" step="1"
                    aria-label="Seek">
            </div>
        </div>

        <div class="transport">
            <button class="btn btn-next" id="prevSpacer" aria-hidden="true" style="visibility:hidden;">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>

            <button class="btn btn-play" id="playBtn" aria-label="Play">
                <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" style="display:none;">
                    <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
                </svg>
            </button>

            <button class="btn btn-next" id="nextBtn" aria-label="Next track">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" />
                </svg>
            </button>
        </div>

        <div class="volume-row">
            <button class="icon-btn" id="muteBtn" aria-label="Mute">
                <svg id="volIconHigh" width="18" height="18" viewBox="0 0 24 24">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
                <svg id="volIconMuted" width="18" height="18" viewBox="0 0 24 24" style="display:none;">
                    <path
                        d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.42.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.94 8.94 0 0 0 3.69-1.81L18.73 21 20 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z" />
                </svg>
            </button>
            <input type="range" class="volume-input" id="volume" min="0" max="100" value="100" aria-label="Volume">
        </div>

        <div class="foot">
            <span class="lib-count" id="libCount">— tracks</span>
            <button class="scan-btn" id="scanBtn">
                <span class="dot"></span>
                <span id="scanLabel">RESCAN LIBRARY</span>
            </button>
        </div>

        <p class="status-line" id="status"></p>
    </div>

    <audio id="playerA" preload="none"></audio>
    <audio id="playerB" preload="none"></audio>

    <script>
        (function () {
            // ---- config ----------------------------------------------------------
            // Point this at wherever your FastAPI backend is running.
            // If you open this file on the same machine as the backend, localhost is fine.
            // If you're opening it on your iPhone, use your computer's LAN IP, e.g.
            // 'http://192.168.1.50:8000'
            const API_BASE = '';

            const PRELOAD_SECONDS_BEFORE_END = 12; // start fetching+buffering the next track this many seconds before the current one ends

            // ---- dom refs ----------------------------------------------------------
            const els = {
                title: document.getElementById('title'),
                artist: document.getElementById('artist'),
                eyebrow: document.getElementById('eyebrow'),
                onair: document.getElementById('onair'),
                onairLabel: document.getElementById('onairLabel'),
                timeElapsed: document.getElementById('timeElapsed'),
                timeTotal: document.getElementById('timeTotal'),
                dialFill: document.getElementById('dialFill'),
                dialNeedle: document.getElementById('dialNeedle'),
                seek: document.getElementById('seek'),
                playBtn: document.getElementById('playBtn'),
                playIcon: document.getElementById('playIcon'),
                pauseIcon: document.getElementById('pauseIcon'),
                nextBtn: document.getElementById('nextBtn'),
                scanBtn: document.getElementById('scanBtn'),
                scanLabel: document.getElementById('scanLabel'),
                libCount: document.getElementById('libCount'),
                status: document.getElementById('status'),
                disc: document.getElementById('disc'),
                discInitial: document.getElementById('discInitial'),
                volume: document.getElementById('volume'),
                muteBtn: document.getElementById('muteBtn'),
                volIconHigh: document.getElementById('volIconHigh'),
                volIconMuted: document.getElementById('volIconMuted'),
            };

            const audios = {
                A: document.getElementById('playerA'),
                B: document.getElementById('playerB'),
            };

            let active = 'A';
            const meta = { A: null, B: null }; // track metadata objects per slot
            let preloadStarted = { A: false, B: false };
            let isSeeking = false;
            let volume = 1;
            let volumeBeforeMute = 1;

            function otherSlot(s) { return s === 'A' ? 'B' : 'A'; }
            function activeAudio() { return audios[active]; }

            function streamUrl(id) { return `${API_BASE}/api/stream/${id}`; }

            function fmtTime(sec) {
                if (!isFinite(sec) || sec < 0) sec = 0;
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function setStatus(msg, isErr) {
                els.status.textContent = msg || '';
                els.status.classList.toggle('err', !!isErr);
            }

            async function apiGetNextTrack() {
                const res = await fetch(`${API_BASE}/api/next`);
                if (!res.ok) throw new Error(`api/next -> ${res.status}`);
                return res.json();
            }

            async function refreshLibraryCount() {
                try {
                    const res = await fetch(`${API_BASE}/api/info`);
                    const data = await res.json();
                    els.libCount.textContent = `${data.tracks_count} tracks in rotation`;
                } catch (e) {
                    els.libCount.textContent = 'library offline';
                }
            }

            // ---- generative cover art -------------------------------------------------

            function hashString(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = (h * 31 + str.charCodeAt(i)) | 0;
                }
                return Math.abs(h);
            }

            function applyCoverFor(track) {
                const key = `${track.title || ''}::${track.artist || ''}`;
                const h = hashString(key);
                const hue1 = h % 360;
                const hue2 = (hue1 + 45 + (h % 70)) % 360;
                const hue3 = (hue1 + 200) % 360;
                const angle = h % 360;
                els.disc.style.background = `conic-gradient(from ${angle}deg, hsl(${hue1} 68% 46%), hsl(${hue2} 60% 36%), hsl(${hue3} 55% 40%), hsl(${hue1} 68% 46%))`;
                els.discInitial.textContent = (track.title || '?').trim().charAt(0).toUpperCase() || '?';
            }

            // ---- UI rendering --------------------------------------------------------

            function renderMetaForActive() {
                const t = meta[active];
                if (!t) return;
                els.title.textContent = t.title || 'Untitled';
                els.artist.textContent = t.artist || 'Unknown artist';
                els.eyebrow.textContent = 'NOW PLAYING';
                els.timeTotal.textContent = fmtTime(t.duration || 0);
                applyCoverFor(t);

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: t.title || 'Untitled',
                        artist: t.artist || 'Unknown artist',
                        album: 'Pivlab FM',
                    });
                }
            }

            function renderProgress(currentTime) {
                const t = meta[active];
                const dur = (t && t.duration) ? t.duration : 0;
                const pct = dur > 0 ? Math.min(100, (currentTime / dur) * 100) : 0;
                els.timeElapsed.textContent = fmtTime(currentTime);
                els.dialFill.style.width = pct + '%';
                els.dialNeedle.style.left = pct + '%';
                if (!isSeeking) els.seek.value = Math.round(pct * 10);
            }

            function setPlayingUI(isPlaying) {
                document.body.classList.toggle('playing', isPlaying);
                els.playIcon.style.display = isPlaying ? 'none' : '';
                els.pauseIcon.style.display = isPlaying ? '' : 'none';
                els.playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
                els.onair.classList.toggle('live', isPlaying);
                els.onairLabel.textContent = isPlaying ? 'ON AIR' : 'OFF AIR';
            }

            // ---- loading tracks into slots --------------------------------------------

            function loadTrackIntoSlot(slot, track) {
                meta[slot] = track;
                preloadStarted[slot] = false;
                const audio = audios[slot];
                audio.src = streamUrl(track.id);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.load();
            }

            function clearSlot(slot) {
                const audio = audios[slot];
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                meta[slot] = null;
                preloadStarted[slot] = false;
            }

            async function playFreshIntoActive() {
                setStatus('tuning in…');
                try {
                    const track = await apiGetNextTrack();
                    loadTrackIntoSlot(active, track);
                    renderMetaForActive();
                    await activeAudio().play();
                    setPlayingUI(true);
                    setStatus('');
                } catch (e) {
                    console.error(e);
                    setStatus('couldn\u2019t reach the station — check the backend address', true);
                }
            }

            async function preloadNextTrack() {
                const slot = otherSlot(active);
                if (meta[slot] || preloadStarted[slot]) return;
                preloadStarted[slot] = true;
                try {
                    const track = await apiGetNextTrack();
                    if (slot === otherSlot(active)) {
                        loadTrackIntoSlot(slot, track);
                    }
                } catch (e) {
                    console.error('preload failed', e);
                    preloadStarted[slot] = false;
                }
            }

            function swapToPreloadedOrFresh() {
                const nextSlot = otherSlot(active);
                if (meta[nextSlot]) {
                    const oldSlot = active;
                    active = nextSlot;
                    renderMetaForActive();
                    const p = activeAudio().play();
                    if (p && p.catch) p.catch(err => console.error('play() on swap failed', err));
                    setPlayingUI(true);
                    clearSlot(oldSlot);
                } else {
                    playFreshIntoActive();
                }
            }

            // ---- transport controls --------------------------------------------------

            async function togglePlay() {
                const audio = activeAudio();
                if (!meta[active]) {
                    await playFreshIntoActive();
                    return;
                }
                if (audio.paused) {
                    try {
                        await audio.play();
                        setPlayingUI(true);
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    audio.pause();
                    setPlayingUI(false);
                }
            }

            function skipNext() {
                if (!meta[active]) {
                    playFreshIntoActive();
                    return;
                }
                swapToPreloadedOrFresh();
            }

            // ---- wire up both audio elements' events ----------------------------------

            ['A', 'B'].forEach(slot => {
                const audio = audios[slot];

                audio.addEventListener('timeupdate', () => {
                    if (slot !== active) return;
                    renderProgress(audio.currentTime);
                    const t = meta[active];
                    const dur = t ? t.duration : 0;
                    if (dur > 0 && (dur - audio.currentTime) <= PRELOAD_SECONDS_BEFORE_END) {
                        preloadNextTrack();
                    }
                });

                audio.addEventListener('ended', () => {
                    if (slot !== active) return;
                    swapToPreloadedOrFresh();
                });

                audio.addEventListener('waiting', () => {
                    if (slot === active) setStatus('buffering…');
                });
                audio.addEventListener('playing', () => {
                    if (slot === active) setStatus('');
                });
                audio.addEventListener('error', () => {
                    if (slot === active) setStatus('playback error on this track', true);
                });
            });

            // ---- seek bar interaction --------------------------------------------------

            els.seek.addEventListener('input', () => {
                isSeeking = true;
                const t = meta[active];
                const dur = t ? t.duration : 0;
                const previewSec = (els.seek.value / 1000) * dur;
                els.timeElapsed.textContent = fmtTime(previewSec);
                const pct = els.seek.value / 10;
                els.dialFill.style.width = pct + '%';
                els.dialNeedle.style.left = pct + '%';
            });

            els.seek.addEventListener('change', () => {
                const t = meta[active];
                const dur = t ? t.duration : 0;
                if (dur > 0) {
                    activeAudio().currentTime = (els.seek.value / 1000) * dur;
                }
                isSeeking = false;
            });

            // ---- volume interaction --------------------------------------------------

            function applyVolumeUI(v) {
                els.volume.style.background = `linear-gradient(to right, var(--amber) ${v * 100}%, rgba(255,255,255,0.1) ${v * 100}%)`;
                els.volIconHigh.style.display = v === 0 ? 'none' : '';
                els.volIconMuted.style.display = v === 0 ? '' : 'none';
            }

            function setVolume(v) {
                volume = Math.min(1, Math.max(0, v));
                audios.A.volume = volume;
                audios.B.volume = volume;
                applyVolumeUI(volume);
            }

            els.volume.addEventListener('input', () => {
                setVolume(els.volume.value / 100);
            });

            els.muteBtn.addEventListener('click', () => {
                if (volume > 0) {
                    volumeBeforeMute = volume;
                    setVolume(0);
                    els.volume.value = 0;
                } else {
                    setVolume(volumeBeforeMute || 1);
                    els.volume.value = Math.round((volumeBeforeMute || 1) * 100);
                }
            });

            // ---- buttons ---------------------------------------------------------

            els.playBtn.addEventListener('click', togglePlay);
            els.nextBtn.addEventListener('click', skipNext);

            els.scanBtn.addEventListener('click', async () => {
                els.scanBtn.disabled = true;
                els.scanBtn.classList.add('busy');
                els.scanLabel.textContent = 'SCANNING…';
                try {
                    const res = await fetch(`${API_BASE}/api/scan`, { method: 'POST' });
                    if (!res.ok) throw new Error(`api/scan -> ${res.status}`);
                    els.scanLabel.textContent = 'LIBRARY SYNCED';
                    await refreshLibraryCount();
                } catch (e) {
                    console.error(e);
                    els.scanLabel.textContent = 'SCAN FAILED';
                } finally {
                    els.scanBtn.classList.remove('busy');
                    setTimeout(() => {
                        els.scanLabel.textContent = 'RESCAN LIBRARY';
                        els.scanBtn.disabled = false;
                    }, 1800);
                }
            });

            // ---- media session (lock screen controls on iOS/Android) ------------------

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('nexttrack', skipNext);
            }

            // ---- init ---------------------------------------------------------

            applyVolumeUI(1);
            refreshLibraryCount();
        })();
    </script>
</body>

</html>
