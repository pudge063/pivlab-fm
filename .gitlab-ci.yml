stages:
  - publish-internal
  - publish-dockerhub

variables:
  NEXUS_URL: nexus.pivlab.space
  NEXUS_PORT: 6001
  BUILDER: custom_builder
  CI_COMMIT_TAG: 1.0.1
  REGISTRY: pudge063

.build:
  stage: publish-internal
  tags: [ immortal-dood ]
  before_script:
    - docker buildx use $BUILDER
  script:
    - export PUBLISH_TAG=${CI_COMMIT_TAG:-"$CI_COMMIT_SHA"}
    - |
      docker buildx b \
        --provenance=false \
        --platform linux/amd64 \
        -f ${COMPONENT}/Dockerfile \
        -t ${PUBLISH_PATH}:${PUBLISH_TAG} \
        --push ${COMPONENT}/
  rules:
    - if: "$CI_COMMIT_TAG"
    - changes:
        - $COMPONENT/*

build:fm-client:
  variables:
    COMPONENT: fm_client
    PUBLISH_PATH: $NEXUS_URL:$NEXUS_PORT/${COMPONENT}
  extends: [ .build ]

build:fm-server:
  variables:
    COMPONENT: fm_server
    PUBLISH_PATH: $NEXUS_URL:$NEXUS_PORT/${COMPONENT}
  extends: [ .build ]

build:fm-client-dockerhub:
  stage: publish-dockerhub
  variables:
    COMPONENT: fm_client
    PUBLISH_PATH: $REGISTRY/fm-client
  extends: [ .build ]
  when: manual
  needs: [ build:fm-client ]

build:fm-server-dockerhub:
  stage: publish-dockerhub
  variables:
    COMPONENT: fm_server
    PUBLISH_PATH: $REGISTRY/fm-server
  extends: [ .build ]
  when: manual
  needs: [ build:fm-server ]
